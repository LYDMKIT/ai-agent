<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>小智 · 网页智能体</title>
<style>
  :root {
    --bg: #0f1117;
    --panel: #171a23;
    --panel-2: #1e2230;
    --border: #2a2f3f;
    --text: #e8eaf2;
    --text-dim: #9aa1b5;
    --accent: #6c5ce7;
    --accent-2: #00cec9;
    --user-bubble: #5b4fd4;
    --bot-bubble: #232838;
    --danger: #ff7675;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
    flex-direction: column;
  }

  /* ===== 顶栏 ===== */
  header {
    display: flex; align-items: center; gap: 12px;
    padding: 14px 18px;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    position: sticky; top: 0; z-index: 10;
  }
  .logo {
    width: 38px; height: 38px; border-radius: 12px; flex-shrink: 0;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    display: flex; align-items: center; justify-content: center;
    font-size: 20px;
  }
  .title-wrap { flex: 1; min-width: 0; }
  .title-wrap h1 { font-size: 16px; font-weight: 600; }
  .title-wrap .sub { font-size: 12px; color: var(--text-dim); }
  .controls { display: flex; gap: 8px; }
  select, button.icon-btn {
    background: var(--panel-2); color: var(--text);
    border: 1px solid var(--border); border-radius: 10px;
    padding: 8px 12px; font-size: 13px; cursor: pointer;
    transition: border-color .15s;
  }
  select:hover, button.icon-btn:hover { border-color: var(--accent); }
  button.icon-btn { padding: 8px 10px; }

  /* ===== 消息区 ===== */
  main {
    flex: 1; overflow-y: auto;
    padding: 20px 16px 8px;
    scroll-behavior: smooth;
  }
  .chat { max-width: 820px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
  .msg { display: flex; gap: 10px; animation: fadeUp .25s ease; }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  .avatar {
    width: 34px; height: 34px; border-radius: 10px; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center; font-size: 17px;
  }
  .msg.user { flex-direction: row-reverse; }
  .msg.user .avatar { background: linear-gradient(135deg, #5b4fd4, #8b7cf0); }
  .msg.bot .avatar { background: linear-gradient(135deg, var(--accent), var(--accent-2)); }
  .bubble {
    max-width: 78%; padding: 10px 14px; border-radius: 14px;
    line-height: 1.65; font-size: 14.5px; word-break: break-word;
    white-space: pre-wrap;
  }
  .msg.user .bubble { background: var(--user-bubble); border-top-right-radius: 4px; }
  .msg.bot .bubble { background: var(--bot-bubble); border-top-left-radius: 4px; }
  .bubble code {
    background: rgba(255,255,255,.08); padding: 1px 6px; border-radius: 5px;
    font-family: Consolas, Monaco, monospace; font-size: 13px;
  }
  .tool-card {
    margin-top: 8px; padding: 8px 12px; border-radius: 10px;
    background: rgba(0, 206, 201, .08); border: 1px solid rgba(0, 206, 201, .25);
    font-size: 12.5px; color: var(--accent-2);
    font-family: Consolas, Monaco, monospace;
  }
  .tool-card::before { content: "🛠 "; }

  /* 欢迎页 */
  .welcome { text-align: center; padding: 60px 20px 30px; color: var(--text-dim); }
  .welcome .big { font-size: 44px; margin-bottom: 14px; }
  .welcome h2 { color: var(--text); font-size: 20px; margin-bottom: 8px; }
  .welcome p { font-size: 13.5px; margin-bottom: 28px; line-height: 1.8; }
  .suggestions { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; max-width: 560px; margin: 0 auto; }
  .suggestions button {
    background: var(--panel-2); border: 1px solid var(--border); color: var(--text);
    border-radius: 12px; padding: 10px 16px; font-size: 13px; cursor: pointer;
    transition: all .15s;
  }
  .suggestions button:hover { border-color: var(--accent); transform: translateY(-2px); }

  /* 打字指示 */
  .typing { display: inline-flex; gap: 4px; padding: 4px 0; }
  .typing span {
    width: 7px; height: 7px; border-radius: 50%; background: var(--text-dim);
    animation: blink 1.2s infinite;
  }
  .typing span:nth-child(2) { animation-delay: .2s; }
  .typing span:nth-child(3) { animation-delay: .4s; }
  @keyframes blink { 0%, 80%, 100% { opacity: .25; } 40% { opacity: 1; } }

  /* ===== 输入区 ===== */
  footer { padding: 12px 16px calc(16px + env(safe-area-inset-bottom)); background: var(--panel); border-top: 1px solid var(--border); }
  .input-row { max-width: 820px; margin: 0 auto; display: flex; gap: 10px; align-items: flex-end; }
  #input {
    flex: 1; resize: none; max-height: 140px;
    background: var(--panel-2); color: var(--text);
    border: 1px solid var(--border); border-radius: 14px;
    padding: 11px 14px; font-size: 14.5px; line-height: 1.5;
    font-family: inherit; outline: none; transition: border-color .15s;
  }
  #input:focus { border-color: var(--accent); }
  #send {
    width: 44px; height: 44px; border-radius: 13px; border: none; cursor: pointer;
    background: linear-gradient(135deg, var(--accent), #8b7cf0);
    color: #fff; font-size: 18px; flex-shrink: 0;
    transition: transform .1s, opacity .15s;
  }
  #send:disabled { opacity: .4; cursor: not-allowed; }
  #send:not(:disabled):active { transform: scale(.92); }
  .foot-tip { max-width: 820px; margin: 8px auto 0; font-size: 11.5px; color: var(--text-dim); text-align: center; }

  /* ===== 设置弹窗 ===== */
  .modal-mask {
    position: fixed; inset: 0; background: rgba(0,0,0,.55);
    display: none; align-items: center; justify-content: center; z-index: 100; padding: 16px;
  }
  .modal-mask.show { display: flex; }
  .modal {
    background: var(--panel); border: 1px solid var(--border); border-radius: 16px;
    width: 100%; max-width: 440px; padding: 22px;
    animation: fadeUp .2s ease;
  }
  .modal h3 { font-size: 16px; margin-bottom: 16px; }
  .field { margin-bottom: 14px; }
  .field label { display: block; font-size: 12.5px; color: var(--text-dim); margin-bottom: 6px; }
  .field input, .field select {
    width: 100%; background: var(--panel-2); color: var(--text);
    border: 1px solid var(--border); border-radius: 10px;
    padding: 9px 12px; font-size: 13.5px; outline: none; font-family: inherit;
  }
  .field input:focus { border-color: var(--accent); }
  .modal-btns { display: flex; gap: 10px; justify-content: flex-end; margin-top: 18px; }
  .modal-btns button {
    border: none; border-radius: 10px; padding: 9px 18px; font-size: 13.5px; cursor: pointer;
    font-family: inherit;
  }
  .btn-primary { background: var(--accent); color: #fff; }
  .btn-ghost { background: var(--panel-2); color: var(--text-dim); }
  .btn-danger { background: transparent; color: var(--danger); margin-right: auto; }

  /* toast */
  #toast {
    position: fixed; top: 20px; left: 50%; transform: translateX(-50%) translateY(-80px);
    background: var(--panel-2); border: 1px solid var(--border); color: var(--text);
    padding: 10px 20px; border-radius: 12px; font-size: 13px; z-index: 200;
    transition: transform .3s ease; box-shadow: 0 8px 30px rgba(0,0,0,.4);
  }
  #toast.show { transform: translateX(-50%) translateY(0); }

  /* markdown 简易样式 */
  .bubble strong { color: #fff; }

  @media (max-width: 600px) {
    .bubble { max-width: 88%; }
    .title-wrap .sub { display: none; }
  }
</style>
</head>
<body>

<header>
  <div class="logo">🤖</div>
  <div class="title-wrap">
    <h1>小智 · 网页智能体</h1>
    <div class="sub" id="statusLine">GLM-4-Flash（免费）· 记忆已启用 · 带工具</div>
  </div>
  <div class="controls">
    <select id="modelSel" title="切换模型">
      <option value="glm-4-flash">GLM-4-Flash（免费）</option>
      <option value="glm-4-flashx">GLM-4-FlashX（免费）</option>
      <option value="glm-4-plus">GLM-4-Plus（付费）</option>
      <option value="deepseek">DeepSeek（需自配 key）</option>
    </select>
    <button class="icon-btn" id="btnSettings" title="设置">⚙️</button>
    <button class="icon-btn" id="btnClear" title="清空对话">🗑️</button>
  </div>
</header>

<main id="main">
  <div class="chat" id="chat">
    <div class="welcome" id="welcome">
      <div class="big">👋</div>
      <h2>你好，我是小智</h2>
      <p>一个跑在浏览器里的智能体：自带计算器 🧮 和笔记本 📝 两个工具，<br>
      对话记录保存在本地，刷新不丢。试着派个任务给我：</p>
      <div class="suggestions">
        <button data-q="帮我算一下 (1234 + 5678) * 2 - 500 等于多少">🧮 算个数</button>
        <button data-q="帮我记一条笔记：明天上午 9 点开组会">📝 记条笔记</button>
        <button data-q="我之前让你记过什么笔记？">🔍 查看笔记</button>
        <button data-q="用一句话介绍你自己，你都会做什么">💬 聊聊天</button>
      </div>
    </div>
  </div>
</main>

<footer>
  <div class="input-row">
    <textarea id="input" rows="1" placeholder="给我派个任务吧…（Enter 发送，Shift+Enter 换行）"></textarea>
    <button id="send" title="发送">➤</button>
  </div>
  <div class="foot-tip">内容由 AI 生成，请自行甄别 · API Key 可在 ⚙️ 设置中更换</div>
</footer>

<!-- 设置弹窗 -->
<div class="modal-mask" id="settingsMask">
  <div class="modal">
    <h3>⚙️ 设置</h3>
    <div class="field">
      <label>智谱 API Key（bigmodel.cn）</label>
      <input id="cfgZhipuKey" type="password" placeholder="留空使用内置 Key">
    </div>
    <div class="field">
      <label>DeepSeek API Key（platform.deepseek.com，选 DeepSeek 模型时必填）</label>
      <input id="cfgDeepseekKey" type="password" placeholder="sk-...">
    </div>
    <div class="field">
      <label>系统提示词（智能体的性格与规则）</label>
      <input id="cfgSystem" type="text" placeholder="留空使用默认">
    </div>
    <div class="modal-btns">
      <button class="btn-danger" id="btnReset">恢复默认</button>
      <button class="btn-ghost" id="btnCancel">取消</button>
      <button class="btn-primary" id="btnSave">保存</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
/* ================= 配置 ================= */
const DEFAULT_ZHIPU_KEY = "a012e069d8a44161bcf23879e017b303.Jy8nYHgJF32UJoWp";
const LS_CFG = "agent_cfg";
const LS_CHAT = "agent_chat";
const MAX_TURNS = 30;      // 记忆保留的对话轮数
const MAX_STEPS = 6;       // agent loop 最大步数

const cfg = loadCfg();
function loadCfg() {
  try { return JSON.parse(localStorage.getItem(LS_CFG)) || {}; } catch { return {}; }
}
function zhipuKey() { return cfg.zhipuKey || DEFAULT_ZHIPU_KEY; }

const DEFAULT_SYSTEM = `你是"小智"，一个运行在浏览器里的智能体助手。你有真实的工具可以用：
- calculator：精确数学计算器，任何算术都应使用它而不是心算
- save_note：把信息保存为笔记（持久保存在用户浏览器里）
- get_notes：读取已保存的笔记
- delete_note：删除某条笔记
遇到计算、记录、查询笔记类需求时主动使用工具。回复简洁、友好，用中文。`;

function systemPrompt() { return cfg.system || DEFAULT_SYSTEM; }

/* ================= 工具（浏览器端真实实现） ================= */
const LS_NOTES = "agent_notes";

function calculator(expression) {
  // 安全计算：只允许数字和运算符
  const expr = String(expression).replace(/\s+/g, "");
  if (!/^[-+*/%.()0-9eE,]+$/.test(expr)) return "错误：表达式包含不允许的字符";
  try {
    const val = Function('"use strict"; return (' + expr + ')')();
    if (typeof val !== "number" || !isFinite(val)) return "错误：无法计算";
    return String(val);
  } catch { return "错误：表达式无效"; }
}

function saveNote(title, content) {
  const notes = JSON.parse(localStorage.getItem(LS_NOTES) || "[]");
  notes.push({ title, content, time: new Date().toLocaleString("zh-CN") });
  localStorage.setItem(LS_NOTES, JSON.stringify(notes));
  return `已保存笔记「${title}」，当前共 ${notes.length} 条`;
}

function getNotes() {
  const notes = JSON.parse(localStorage.getItem(LS_NOTES) || "[]");
  if (!notes.length) return "目前没有任何笔记";
  return notes.map((n, i) => `${i + 1}. 「${n.title}」${n.content}（保存于 ${n.time}）`).join("\n");
}

function deleteNote(index) {
  const notes = JSON.parse(localStorage.getItem(LS_NOTES) || "[]");
  const i = parseInt(index) - 1;
  if (i < 0 || i >= notes.length) return "错误：序号不存在";
  const removed = notes.splice(i, 1)[0];
  localStorage.setItem(LS_NOTES, JSON.stringify(notes));
  return `已删除笔记「${removed.title}」`;
}

const TOOLS = [
  { type: "function", function: {
    name: "calculator", description: "精确数学计算器，支持加减乘除、括号、百分比",
    parameters: { type: "object", properties: { expression: { type: "string", description: "数学表达式，如 (1234+5678)*2-500" } }, required: ["expression"] }
  }},
  { type: "function", function: {
    name: "save_note", description: "保存一条笔记到用户的浏览器（持久保存）",
    parameters: { type: "object", properties: { title: { type: "string", description: "笔记标题" }, content: { type: "string", description: "笔记内容" } }, required: ["title", "content"] }
  }},
  { type: "function", function: {
    name: "get_notes", description: "读取所有已保存的笔记",
    parameters: { type: "object", properties: {} }
  }},
  { type: "function", function: {
    name: "delete_note", description: "按序号删除一条笔记",
    parameters: { type: "object", properties: { index: { type: "string", description: "笔记序号（从1开始）" } }, required: ["index"] }
  }},
];

function runTool(name, args) {
  try {
    switch (name) {
      case "calculator":  return calculator(args.expression);
      case "save_note":   return saveNote(args.title, args.content);
      case "get_notes":   return getNotes();
      case "delete_note": return deleteNote(args.index);
      default: return `未知工具：${name}`;
    }
  } catch (e) { return "工具执行出错：" + e.message; }
}

/* ================= 模型调用 ================= */
function apiEndpoint(model) {
  if (model === "deepseek") return "https://api.deepseek.com/chat/completions";
  return "https://open.bigmodel.cn/api/paas/v4/chat/completions";
}
function apiKey(model) {
  if (model === "deepseek") return cfg.deepseekKey || "";
  return zhipuKey();
}

/* ================= 对话状态 ================= */
let history = [];          // {role, content}，含工具消息
let busy = false;

function trimHistory() {
  // 保留最近 MAX_TURNS 条 user/assistant 消息（工具消息跟随其 assistant）
  const kept = [];
  for (let i = history.length - 1, turns = 0; i >= 0 && turns <= MAX_TURNS; i--) {
    const r = history[i].role;
    kept.unshift(history[i]);
    if (r === "assistant" && history[i].content) turns++;
  }
  history = kept;
}

/* ================= UI ================= */
const chatEl = document.getElementById("chat");
const welcomeEl = document.getElementById("welcome");
const inputEl = document.getElementById("input");
const sendEl = document.getElementById("send");
const mainEl = document.getElementById("main");
const modelSel = document.getElementById("modelSel");
const statusLine = document.getElementById("statusLine");

function esc(s) { return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }
function fmt(s) {
  return esc(s)
    .replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>")
    .replace(/`([^`]+)`/g, "<code>$1</code>");
}

function addMsg(role, text, toolInfo) {
  welcomeEl && welcomeEl.remove();
  const div = document.createElement("div");
  div.className = "msg " + (role === "user" ? "user" : "bot");
  const avatar = document.createElement("div");
  avatar.className = "avatar";
  avatar.textContent = role === "user" ? "🙂" : "🤖";
  const bubble = document.createElement("div");
  bubble.className = "bubble";
  bubble.innerHTML = fmt(text) + (toolInfo ? `<div class="tool-card">${esc(toolInfo)}</div>` : "");
  div.append(avatar, bubble);
  chatEl.appendChild(div);
  mainEl.scrollTop = mainEl.scrollHeight;
  return bubble;
}

function setTyping(on) {
  const old = document.getElementById("typingMsg");
  if (old) old.remove();
  if (on) {
    const div = document.createElement("div");
    div.className = "msg bot"; div.id = "typingMsg";
    div.innerHTML = `<div class="avatar">🤖</div><div class="bubble"><span class="typing"><span></span><span></span><span></span></span></div>`;
    chatEl.appendChild(div);
    mainEl.scrollTop = mainEl.scrollHeight;
  }
}

let toastTimer;
function toast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg; t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove("show"), 2500);
}

/* ================= Agent Loop ================= */
async function callModel(model, messages, stream) {
  const key = apiKey(model);
  if (!key) throw new Error(model === "deepseek" ? "未配置 DeepSeek API Key，请点右上角 ⚙️ 填写" : "未配置 API Key");
  const body = { model: model === "deepseek" ? "deepseek-chat" : model, messages, stream: !!stream };
  if (model !== "deepseek") body.tools = TOOLS;
  else body.tools = TOOLS; // DeepSeek 也支持 function calling
  const resp = await fetch(apiEndpoint(model), {
    method: "POST",
    headers: { "Content-Type": "application/json", "Authorization": "Bearer " + key },
    body: JSON.stringify(body),
  });
  if (!resp.ok) {
    const errText = await resp.text().catch(() => "");
    throw new Error(`API 错误 ${resp.status}：${errText.slice(0, 200)}`);
  }
  return resp;
}

async function sendMessage(text) {
  if (busy) return;
  busy = true; sendEl.disabled = true;
  const model = modelSel.value;

  addMsg("user", text);
  history.push({ role: "user", content: text });
  saveChat();

  let bubble = null;
  let fullText = "";
  let toolLog = "";

  try {
    for (let step = 0; step < MAX_STEPS; step++) {
      const messages = [{ role: "system", content: systemPrompt() }, ...history];
      const resp = await callModel(model, messages, true);

      // ---- 流式读取 ----
      setTyping(true);
      const reader = resp.body.getReader();
      const decoder = new TextDecoder();
      let buf = "";
      let msgObj = { role: "assistant", content: "", tool_calls: [] };
      let started = false;

      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        buf += decoder.decode(value, { stream: true });
        const lines = buf.split("\n");
        buf = lines.pop();
        for (const line of lines) {
          const s = line.trim();
          if (!s.startsWith("data:")) continue;
          const data = s.slice(5).trim();
          if (data === "[DONE]") continue;
          try {
            const j = JSON.parse(data);
            const delta = j.choices?.[0]?.delta || {};
            if (delta.content) {
              if (!started) { setTyping(false); bubble = addMsg("bot", ""); started = true; }
              msgObj.content += delta.content;
              fullText = msgObj.content;
              bubble.innerHTML = fmt(fullText) + (toolLog ? `<div class="tool-card">${esc(toolLog)}</div>` : "");
              mainEl.scrollTop = mainEl.scrollHeight;
            }
            if (delta.tool_calls) {
              for (const tc of delta.tool_calls) {
                const idx = tc.index ?? 0;
                msgObj.tool_calls[idx] = msgObj.tool_calls[idx] || { id: "", function: { name: "", arguments: "" } };
                if (tc.id) msgObj.tool_calls[idx].id = tc.id;
                if (tc.function?.name) msgObj.tool_calls[idx].function.name += tc.function.name;
                if (tc.function?.arguments) msgObj.tool_calls[idx].function.arguments += tc.function.arguments;
              }
            }
          } catch { /* 忽略解析失败的行 */ }
        }
      }
      setTyping(false);

      msgObj.tool_calls = (msgObj.tool_calls || []).filter(t => t && t.function?.name);

      if (!started && !msgObj.tool_calls.length) {
        bubble = addMsg("bot", "（空响应）");
        break;
      }

      // ---- 执行工具 ----
      if (msgObj.tool_calls.length) {
        history.push({ role: "assistant", content: msgObj.content || "", tool_calls: msgObj.tool_calls });
        for (const tc of msgObj.tool_calls) {
          let args = {};
          try { args = JSON.parse(tc.function.arguments || "{}"); } catch {}
          const result = runTool(tc.function.name, args);
          toolLog += `${tc.function.name}(${JSON.stringify(args)}) → ${result}\n`;
          history.push({ role: "tool", tool_call_id: tc.id, content: String(result) });
          if (bubble) {
            bubble.innerHTML = fmt(fullText) + `<div class="tool-card">${esc(toolLog)}</div>`;
            mainEl.scrollTop = mainEl.scrollHeight;
          }
        }
        saveChat();
        continue; // 带着工具结果回到循环，让模型继续思考
      }

      // ---- 纯文本回复，结束 ----
      if (msgObj.content) history.push({ role: "assistant", content: msgObj.content });
      saveChat();
      break;
    }
  } catch (e) {
    setTyping(false);
    addMsg("bot", "❌ 出错了：" + e.message);
  } finally {
    busy = false; sendEl.disabled = false;
  }
}

/* ================= 持久化 ================= */
function saveChat() {
  // 工具消息里的结构无法纯文本还原，只存展示需要的部分
  try { localStorage.setItem(LS_CHAT, JSON.stringify(history.slice(-MAX_TURNS * 4))); } catch {}
}
function loadChat() {
  try {
    const saved = JSON.parse(localStorage.getItem(LS_CHAT) || "[]");
    if (!saved.length) return;
    welcomeEl && welcomeEl.remove();
    for (const m of saved) {
      if (m.role === "user") addMsg("user", m.content);
      else if (m.role === "assistant" && m.content) {
        const tc = (m.tool_calls || []).map(t => `${t.function.name}`).join(", ");
        addMsg("bot", m.content, tc ? `调用工具：${tc}` : "");
      }
      // 工具结果消息不单独渲染
    }
    history = saved;
  } catch {}
}

/* ================= 事件 ================= */
function autoResize() {
  inputEl.style.height = "auto";
  inputEl.style.height = Math.min(inputEl.scrollHeight, 140) + "px";
}
inputEl.addEventListener("input", autoResize);
inputEl.addEventListener("keydown", e => {
  if (e.key === "Enter" && !e.shiftKey && !e.isComposing) {
    e.preventDefault();
    const v = inputEl.value.trim();
    if (v) { inputEl.value = ""; autoResize(); sendMessage(v); }
  }
});
sendEl.addEventListener("click", () => {
  const v = inputEl.value.trim();
  if (v) { inputEl.value = ""; autoResize(); sendMessage(v); }
});
document.querySelectorAll(".suggestions button").forEach(b => {
  b.addEventListener("click", () => sendMessage(b.dataset.q));
});
modelSel.addEventListener("change", () => {
  statusLine.textContent = modelSel.options[modelSel.selectedIndex].text + " · 记忆已启用 · 带工具";
  if (modelSel.value === "deepseek" && !cfg.deepseekKey) toast("使用 DeepSeek 需先在 ⚙️ 设置里填 API Key");
});

/* 清空对话 */
document.getElementById("btnClear").addEventListener("click", () => {
  if (!confirm("确定清空当前对话吗？")) return;
  history = [];
  localStorage.removeItem(LS_CHAT);
  location.reload();
});

/* 设置弹窗 */
const mask = document.getElementById("settingsMask");
document.getElementById("btnSettings").addEventListener("click", () => {
  document.getElementById("cfgZhipuKey").value = cfg.zhipuKey || "";
  document.getElementById("cfgDeepseekKey").value = cfg.deepseekKey || "";
  document.getElementById("cfgSystem").value = cfg.system || "";
  mask.classList.add("show");
});
document.getElementById("btnCancel").addEventListener("click", () => mask.classList.remove("show"));
mask.addEventListener("click", e => { if (e.target === mask) mask.classList.remove("show"); });
document.getElementById("btnSave").addEventListener("click", () => {
  const z = document.getElementById("cfgZhipuKey").value.trim();
  const d = document.getElementById("cfgDeepseekKey").value.trim();
  const s = document.getElementById("cfgSystem").value.trim();
  if (z) cfg.zhipuKey = z; else delete cfg.zhipuKey;
  if (d) cfg.deepseekKey = d; else delete cfg.deepseekKey;
  if (s) cfg.system = s; else delete cfg.system;
  localStorage.setItem(LS_CFG, JSON.stringify(cfg));
  mask.classList.remove("show");
  toast("设置已保存");
});
document.getElementById("btnReset").addEventListener("click", () => {
  localStorage.removeItem(LS_CFG);
  mask.classList.remove("show");
  toast("已恢复默认设置");
});

/* 启动 */
loadChat();
inputEl.focus();
</script>
</body>
</html>
